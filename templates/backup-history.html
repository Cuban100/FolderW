<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.materialdesignicons.com/5.4.55/css/materialdesignicons.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/static/index.css">
    <script src="/static/sidebar.js"></script>
</head>
<body class="bg-[var(--bg)] text-[var(--text)] font-sans antialiased">
    {% include "_sidebar.html" %}
        <div class="content p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold mb-4 text-[var(--text)]">Manage Previous Databases</h2>
                {% if error %}
                <div class="bg-[var(--error-bg)] border border-[var(--border)] text-[var(--error-text)] px-4 py-3 rounded relative mb-4" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                {% if success %}
                <div class="bg-[var(--success-bg)] border border-[var(--border)] text-[var(--success-text)] px-4 py-3 rounded relative mb-4" role="alert">
                    {{ success }}
                </div>
                {% endif %}
                <div>
                    <form method="post" action="/delete-old-database/">
                        <label for="database_to_delete" class="text-[var(--text)] font-medium">Select Database to Delete:</label>
                        <select name="database_to_delete" id="database_to_delete" class="form-select mt-1 block w-full bg-[var(--surface)] text-[var(--text)] border border-[var(--border)] rounded px-2 py-1">
                            {% for filename in previous_databases %}
                            <option value="{{ filename }}">{{ filename }}</option>
                            {% endfor %}
                        </select>
                        <button type="submit" class="mt-4 bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 transition duration-300">Delete Selected Database</button>
                    </form>
                </div>
            </div>
        </div>
        <!-- Add a section for manual deletion of old databases -->
</body>
</html>
