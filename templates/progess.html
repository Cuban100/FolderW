<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rsync Progress</title>
    <style>
        #progress-container {
            width: 100%;
            height: 30px;
            background-color: #f3f3f3;
        }
        #progress-bar {
            height: 100%;
            background-color: #4caf50;
            width: 0;
        }
    </style>
</head>
<body>

<h1>Rsync Progress</h1>

<div id="progress-container">
    <div id="progress-bar"></div>
</div>

<button onclick="startRsync()">Start Rsync</button>

<script>
    function startRsync() {
        // Start rsync process from the backend
        fetch("/start_rsync")
            .then(response => response.json())
            .then(data => {
                console.log(data.message);  // Log success message

                // Create an EventSource to listen for progress updates
                const eventSource = new EventSource("/rsync_progress");

                eventSource.onmessage = function(event) {
                    // Parse the progress percentage from rsync output
                    const progress = parseProgress(event.data);
                    updateProgressBar(progress);
                };
            })
            .catch(error => console.error("Error starting rsync:", error));
    }

    function parseProgress(data) {
        // Parse the percentage from the rsync output (e.g., "50% ...")
        const regex = /(\d+)%/;
        const match = data.match(regex);
        if (match) {
            return parseInt(match[1], 10); // Extract the percentage
        }
        return 0;
    }

    function updateProgressBar(progress) {
        const progressBar = document.getElementById("progress-bar");
        progressBar.style.width = progress + "%";  // Update the progress bar
    }
</script>

</body>
</html>
